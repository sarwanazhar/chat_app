name: Build Flutter Dev APK

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build-dev:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./chat_app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-dev-apk
          path: chat_app/build/app/outputs/flutter-apk/app-debug.apk
